<title>Home Build Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: summary strip on top, one ledger card per contractor that opens into payments, extras and schedule. */
:root{
  --bg:#eef0f2; --surface:#ffffff; --surface2:#f5f6f8; --line:#d9dde3;
  --ink:#16202b; --muted:#5d6b7a; --accent:#1f5fbf; --accent-ink:#ffffff;
  --good:#1d7a4d; --warn:#b26a00; --bad:#b3261e; --track:#dfe3e8;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#1a212a; --surface2:#222b36; --line:#2f3a47;
  --ink:#e8edf2; --muted:#93a1b0; --accent:#6aa3f5; --accent-ink:#0c1a2e;
  --good:#5cc790; --warn:#e5a54b; --bad:#f08a82; --track:#2b3541; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a212a; --surface2:#222b36; --line:#2f3a47;
  --ink:#e8edf2; --muted:#93a1b0; --accent:#6aa3f5; --accent-ink:#0c1a2e;
  --good:#5cc790; --warn:#e5a54b; --bad:#f08a82; --track:#2b3541; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:700;letter-spacing:.01em;text-wrap:balance}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:2.2rem;line-height:1}
.sub{color:var(--muted);font-size:.9rem;margin-top:4px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn.danger{color:var(--bad)}
.btn.link{border:0;background:none;padding:4px 6px;color:var(--accent);font-size:.85rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.totals>div{background:var(--surface);padding:14px 16px;min-width:0}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.big{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.done>i{background:var(--good)}
.overall{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.overall .bar{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.row{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr)) auto;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;width:100%;text-align:left;background:none;border:0}
.who b{font-family:var(--display);font-size:1.35rem;font-weight:600;display:block;line-height:1.1;overflow-wrap:anywhere}
.who span{color:var(--muted);font-size:.85rem}
.col .lbl{display:block;margin-bottom:2px}
.col .v{font-weight:600}
.chev{color:var(--muted);transition:transform .15s}
.open .chev{transform:rotate(90deg)}
.prog{padding:0 16px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prog .bar{flex:1;min-width:140px}
.pill{font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.mute{color:var(--muted)}
.detail{border-top:1px solid var(--line);padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.detail section{min-width:0}
.detail .full{grid-column:1/-1}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.sechead h3{font-size:1.1rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.notes{white-space:pre-wrap;background:var(--surface2);border-radius:6px;padding:10px 12px;margin:0;overflow-wrap:anywhere}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.list li:last-child{border-bottom:0}
.list .t{min-width:0;overflow-wrap:anywhere}
.list .t small{display:block;color:var(--muted)}
.list .a{font-weight:600;white-space:nowrap;text-align:right}
.list .a .btn{margin-top:2px}
.empty{color:var(--muted);font-size:.9rem;padding:6px 0}
.hero-empty{padding:36px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.hero-empty h2{font-size:1.6rem}
.hero-empty p{color:var(--muted);max-width:46ch;margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1}
.modalbg{position:fixed;inset:0;background:rgba(10,15,22,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:100%;max-width:460px;max-height:92vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal h2{font-size:1.5rem}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.field textarea{min-height:110px;resize:vertical}
.modal .foot{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:30;max-width:90vw}
.note{color:var(--muted);font-size:.85rem}
@media (max-width:720px){
  .totals{grid-template-columns:1fr 1fr}
  .totals>div:first-child{grid-column:1/-1}
  .row{grid-template-columns:1fr 1fr 1fr;grid-template-areas:"who who chev" "a b c"}
  .row .who{grid-area:who}.row .chev{grid-area:chev;justify-self:end}
  .detail{grid-template-columns:1fr}
  .big{font-size:1.6rem}
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Home Build Ledger</h1>
      <div class="sub">What each handyman and professional is owed, what you paid, what is left.</div>
    </div>
    <button class="btn primary" id="addPro">+ Add contractor</button>
  </header>
  <div id="root"></div>
  <div class="note" id="status"></div>
</div>
<div id="modalHost"></div>

<script>
(function(){
  var db=null, col=null, items={}, open={}, loaded=false, confirmKey=null;
  var $=function(s){return document.querySelector(s)};
  var root=$('#root'), statusEl=$('#status');
  var fmt=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
  var money=function(n){return fmt.format(n||0)};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
  function uid(){return Math.random().toString(36).slice(2,9)}
  function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function fdate(s){if(!s)return '';var p=s.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
  function sum(a,k){return (a||[]).reduce(function(t,x){return t+(+x[k]||0)},0)}

  function calc(p){
    var extras=sum(p.extras,'amount'), total=(+p.agreed||0)+extras, paid=sum(p.payments,'amount');
    var remaining=total-paid;
    var sched=(p.schedule||[]).slice().sort(function(a,b){return (a.due||'').localeCompare(b.due||'')});
    var t=today(), dueNow=0, cum=0, next=null;
    sched.forEach(function(m){cum+=(+m.amount||0); if(m.due&&m.due<=t)dueNow=cum; if(!next&&cum>paid)next={m:m,short:cum-paid}});
    var behind=Math.max(0,dueNow-paid);
    return {extras:extras,total:total,paid:paid,remaining:remaining,sched:sched,behind:behind,next:next,pct:total>0?Math.min(100,paid/total*100):0};
  }

  function toast(msg){var e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);setTimeout(function(){e.remove()},3200)}

  function save(id,patch){
    if(!col){toast('Saving is not available in this view.');return Promise.resolve()}
    var ref=col.doc(id);
    return ref.update(patch).catch(function(e){toast('Could not save: '+(e&&e.message||'try again'))});
  }
  function create(data){
    return col.add(data).then(function(r){open[r.id]=true}).catch(function(e){toast('Could not save: '+(e&&e.message||'try again'))});
  }

  /* ---------- modal form ---------- */
  function form(title,fields,onSubmit,submitLabel){
    var host=$('#modalHost');
    var html='<div class="modalbg"><form class="modal" id="mform"><h2>'+esc(title)+'</h2>';
    fields.forEach(function(f,i){
      html+='<div class="field"><label for="f'+i+'">'+esc(f.label)+'</label>';
      if(f.type==='textarea')html+='<textarea id="f'+i+'" placeholder="'+esc(f.ph||'')+'">'+esc(f.value||'')+'</textarea>';
      else if(f.type==='select'){html+='<select id="f'+i+'">'+f.options.map(function(o){return '<option'+(o===f.value?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}
      else html+='<input id="f'+i+'" type="'+(f.type||'text')+'"'+(f.type==='number'?' step="0.01" min="0" inputmode="decimal"':'')+' value="'+esc(f.value==null?'':f.value)+'" placeholder="'+esc(f.ph||'')+'"'+(f.required?' required':'')+'>';
      html+='</div>';
    });
    html+='<div class="foot"><button type="button" class="btn" id="mcancel">Cancel</button><button class="btn primary">'+esc(submitLabel||'Save')+'</button></div></form></div>';
    host.innerHTML=html;
    var first=host.querySelector('input,textarea,select'); if(first)first.focus();
    function close(){host.innerHTML=''}
    $('#mcancel').onclick=close;
    host.querySelector('.modalbg').addEventListener('mousedown',function(e){if(e.target===this)close()});
    $('#mform').onsubmit=function(ev){
      ev.preventDefault();
      var v={};fields.forEach(function(f,i){var x=document.getElementById('f'+i).value;v[f.key]=f.type==='number'?(parseFloat(x)||0):x.trim()});
      close();onSubmit(v);
    };
  }

  var METHODS=['Cash','Bank transfer','Check','Card','Zelle / Venmo','Other'];

  function proForm(p){
    p=p||{};
    form(p.id?'Edit contractor':'Add contractor',[
      {key:'name',label:'Name or company',value:p.name,required:true},
      {key:'trade',label:'Trade (plumber, electrician, tiler...)',value:p.trade},
      {key:'phone',label:'Phone',value:p.phone},
      {key:'agreed',label:'Agreed price (USD)',type:'number',value:p.agreed,required:true},
      {key:'notes',label:'Agreement notes',type:'textarea',value:p.notes,ph:'Scope of work, what is included, materials, warranty...'}
    ],function(v){
      if(p.id)save(p.id,v);
      else create(Object.assign({},v,{payments:[],extras:[],schedule:[],createdAt:Date.now()}));
    });
  }
  function payForm(p){
    form('Record payment to '+p.name,[
      {key:'amount',label:'Amount paid (USD)',type:'number',required:true},
      {key:'date',label:'Date',type:'date',value:today(),required:true},
      {key:'method',label:'Method',type:'select',options:METHODS,value:'Cash'},
      {key:'note',label:'Note',ph:'e.g. first installment, materials'}
    ],function(v){save(p.id,{payments:(p.payments||[]).concat([Object.assign({id:uid()},v)])})},'Add payment');
  }
  function extraForm(p){
    form('Extra cost for '+p.name,[
      {key:'desc',label:'What changed or was added',required:true,ph:'e.g. extra bathroom outlet'},
      {key:'amount',label:'Added cost (USD, negative to reduce)',type:'number',required:true},
      {key:'date',label:'Date',type:'date',value:today()}
    ],function(v){save(p.id,{extras:(p.extras||[]).concat([Object.assign({id:uid()},v)])})},'Add extra');
  }
  function msForm(p){
    form('Scheduled payment for '+p.name,[
      {key:'label',label:'Milestone',required:true,ph:'e.g. After demolition'},
      {key:'amount',label:'Amount due (USD)',type:'number',required:true},
      {key:'due',label:'Due date',type:'date',required:true}
    ],function(v){save(p.id,{schedule:(p.schedule||[]).concat([Object.assign({id:uid()},v)])})},'Add to schedule');
  }

  /* ---------- render ---------- */
  function badge(c){
    if(c.total>0&&c.remaining<=0)return c.remaining<0?'<span class="pill warn">Overpaid '+money(-c.remaining)+'</span>':'<span class="pill good">Paid in full</span>';
    if(c.behind>0)return '<span class="pill bad">Behind '+money(c.behind)+'</span>';
    if(c.next)return '<span class="pill mute">Next: '+money(c.next.short)+' by '+fdate(c.next.m.due)+'</span>';
    return '';
  }
  function delBtn(key,label){
    return confirmKey===key
      ?'<button class="btn small danger" data-act="del" data-key="'+key+'">Confirm?</button>'
      :'<button class="btn link" data-act="del" data-key="'+key+'" aria-label="Delete '+esc(label)+'">Delete</button>';
  }
  function detail(p,c){
    var pay=(p.payments||[]).slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'')});
    var h='<div class="detail">';
    h+='<section class="full"><div class="sechead"><h3>Agreement</h3><button class="btn link" data-act="edit" data-id="'+p.id+'">Edit</button></div>'
      +'<div class="note" style="margin-bottom:8px">Base price '+money(p.agreed)+(c.extras?' + extras '+money(c.extras):'')+' = <b class="num">'+money(c.total)+'</b>'+(p.phone?' · '+esc(p.phone):'')+'</div>'
      +(p.notes?'<pre class="notes">'+esc(p.notes)+'</pre>':'<div class="empty">No agreement notes yet. Use Edit to add them.</div>')+'</section>';
    h+='<section><div class="sechead"><h3>Payments</h3><button class="btn small" data-act="pay" data-id="'+p.id+'">+ Payment</button></div>';
    h+=pay.length?'<ul class="list">'+pay.map(function(x){return '<li><div class="t">'+fdate(x.date)+'<small>'+esc(x.method||'')+(x.note?' · '+esc(x.note):'')+'</small></div><div class="a num">'+money(x.amount)+'<br>'+delBtn('pay:'+p.id+':'+x.id,'payment')+'</div></li>'}).join('')+'</ul>':'<div class="empty">No payments recorded.</div>';
    h+='</section>';
    h+='<section><div class="sechead"><h3>Extras</h3><button class="btn small" data-act="extra" data-id="'+p.id+'">+ Extra</button></div>';
    h+=(p.extras||[]).length?'<ul class="list">'+p.extras.map(function(x){return '<li><div class="t">'+esc(x.desc)+'<small>'+fdate(x.date)+'</small></div><div class="a num">'+(x.amount>=0?'+':'')+money(x.amount)+'<br>'+delBtn('extras:'+p.id+':'+x.id,'extra')+'</div></li>'}).join('')+'</ul>':'<div class="empty">No extra costs or change orders.</div>';
    h+='</section>';
    h+='<section class="full"><div class="sechead"><h3>Payment schedule</h3><button class="btn small" data-act="ms" data-id="'+p.id+'">+ Milestone</button></div>';
    var cum=0;
    h+=c.sched.length?'<ul class="list">'+c.sched.map(function(m){cum+=(+m.amount||0);var st=cum<=c.paid?'<span class="pill good">Covered</span>':(m.due<today()?'<span class="pill bad">Overdue</span>':'<span class="pill mute">Upcoming</span>');return '<li><div class="t">'+esc(m.label)+'<small>Due '+fdate(m.due)+'</small></div><div class="a num">'+money(m.amount)+'<br>'+st+' '+delBtn('schedule:'+p.id+':'+m.id,'milestone')+'</div></li>'}).join('')+'</ul>':'<div class="empty">No schedule set. Add milestones to see what is due and when.</div>';
    h+='</section>';
    h+='<div class="actions"><button class="btn danger small" data-act="delpro" data-id="'+p.id+'">'+(confirmKey==='pro:'+p.id?'Confirm: delete contractor and all records':'Delete contractor')+'</button></div>';
    return h+'</div>';
  }
  function render(){
    var ids=Object.keys(items).sort(function(a,b){return (items[a].createdAt||0)-(items[b].createdAt||0)});
    if(!loaded){root.innerHTML='<div class="card hero-empty"><p>Loading your ledger...</p></div>';return}
    if(!ids.length){root.innerHTML='<div class="card hero-empty"><h2>No contractors yet</h2><p>Add each person you hired with the price you agreed. Then record every payment and see what you still owe.</p><button class="btn primary" data-act="add">+ Add your first contractor</button></div>';return}
    var T=0,P=0;
    var cards=ids.map(function(id){
      var p=Object.assign({id:id},items[id]), c=calc(p); T+=c.total;P+=c.paid;
      var isOpen=!!open[id];
      return '<div class="card'+(isOpen?' open':'')+'"><button class="row" data-act="toggle" data-id="'+id+'" aria-expanded="'+isOpen+'">'
        +'<span class="who"><b>'+esc(p.name)+'</b><span>'+esc(p.trade||'Contractor')+'</span></span>'
        +'<span class="col"><span class="lbl">Agreed</span><span class="v num">'+money(c.total)+'</span></span>'
        +'<span class="col"><span class="lbl">Paid</span><span class="v num">'+money(c.paid)+'</span></span>'
        +'<span class="col"><span class="lbl">'+(c.remaining<0?'Over':'Remaining')+'</span><span class="v num" style="color:'+(c.remaining<0?'var(--warn)':(c.remaining===0&&c.total>0?'var(--good)':'inherit'))+'">'+money(Math.abs(c.remaining))+'</span></span>'
        +'<span class="chev" aria-hidden="true">&#9656;</span></button>'
        +'<div class="prog"><div class="bar'+(c.remaining<=0&&c.total>0?' done':'')+'"><i style="width:'+c.pct+'%"></i></div><span class="note num">'+Math.round(c.pct)+'% paid</span>'+badge(c)+'</div>'
        +(isOpen?detail(p,c):'')+'</div>';
    }).join('');
    var R=T-P, pct=T>0?Math.min(100,P/T*100):0;
    root.innerHTML='<div class="totals">'
      +'<div><div class="lbl">Total agreed</div><div class="big num">'+money(T)+'</div></div>'
      +'<div><div class="lbl">Total paid</div><div class="big num">'+money(P)+'</div></div>'
      +'<div><div class="lbl">Still to pay</div><div class="big num">'+money(Math.max(0,R))+'</div></div>'
      +'<div class="overall" style="grid-column:1/-1"><div class="bar"><i style="width:'+pct+'%"></i></div><span class="note num">'+Math.round(pct)+'% of all work paid</span></div>'
      +'</div>'+cards;
  }

  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]'); if(!b)return;
    var act=b.dataset.act, id=b.dataset.id, p=id&&items[id]?Object.assign({id:id},items[id]):null;
    if(act==='add')return proForm();
    if(act==='toggle'){open[id]=!open[id];confirmKey=null;return render()}
    if(!p&&act!=='del')return;
    if(act==='edit')return proForm(p);
    if(act==='pay')return payForm(p);
    if(act==='extra')return extraForm(p);
    if(act==='ms')return msForm(p);
    if(act==='delpro'){
      if(confirmKey==='pro:'+id){confirmKey=null;delete open[id];return col.doc(id).delete().catch(function(){toast('Could not delete.')})}
      confirmKey='pro:'+id;return render();
    }
    if(act==='del'){
      var k=b.dataset.key;
      if(confirmKey!==k){confirmKey=k;return render()}
      confirmKey=null;
      var parts=k.split(':'), field=parts[0], pid=parts[1], rid=parts[2], pro=items[pid];
      if(!pro)return;
      return save(pid,(function(o){o[field]=(pro[field]||[]).filter(function(x){return x.id!==rid});return o})({}));
    }
  });
  $('#addPro').onclick=function(){proForm()};

  render();
  var timer=setTimeout(function(){statusEl.textContent='Still connecting to your saved data...'},10000);
  (window.claude&&window.claude.use?window.claude.use('db'):Promise.resolve(null)).then(function(d){
    db=d;
    if(!db){clearTimeout(timer);loaded=true;statusEl.textContent='Saved data is not available in this view. Open the published page while signed in to use the ledger.';render();return}
    col=db.collection('contractors');
    col.onSnapshot(function(snap){
      clearTimeout(timer);statusEl.textContent='';loaded=true;
      var next={};snap.docs.forEach(function(d){next[d.id]=d.data()});items=next;render();
    },function(err){clearTimeout(timer);loaded=true;statusEl.textContent='Could not load saved data ('+(err&&err.code||'error')+').';render()});
  });
})();
</script>
